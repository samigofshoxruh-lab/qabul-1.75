project_id = "crm-bot"

[auth]
# Регистрации нет: пользователей создаёт главный админ.
enable_signup = false
site_url = "https://samigofshoxruh-lab.github.io/qabul/"

[auth.email]
enable_confirmations = false

# Соцсети не присылают JWT Supabase: подпись проверяет сама функция.
[functions.webhook]
verify_jwt = false

# Вызываются из pg_cron с заголовком x-cron-secret.
[functions.refresh-tokens]
verify_jwt = false

[functions.reminders]
verify_jwt = false

[functions.channels]
verify_jwt = true

[functions.send-message]
verify_jwt = true

[functions.team]
verify_jwt = true

[functions.platform]
verify_jwt = true

[functions.lesson-notify]
verify_jwt = true

# Вызывается триггером базы и pg_cron с заголовком x-cron-secret.
[functions.support-notify]
verify_jwt = false
